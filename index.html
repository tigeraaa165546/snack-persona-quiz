  ["干货区糖区怀旧区，分门别类","G"]],
 ["网购零食后，你的评价风格是：",
  ["写小作文安利，嘴替本替","H"],
  ["好吃就回购，懒得写","J"],
  ["辣度不达标必写差评","B"],
  ["晒图九宫格，可可爱爱","E"]],
 ["冬天和夏天，你的零食切换是：",
  ["都吃冰的，直球不变","J"],
  ["冬天炒货夏天梅子，跟着季节走","G"],
  ["怎么热闹怎么来，一呼百应","A"],
  ["天一冷就找甜的续命","C"]],
 ["给远方朋友寄零食，你会寄：",
  ["一包对方小时候的味道","G"],
  ["硬核大礼包，实在","I"],
  ["附一张手写卡片当嘴替","H"],
  ["可可爱爱的限定包装款","E"]],
 ["零食和正餐打架，你站：",
  ["正餐是正餐，零食是零食","D"],
  ["零吃到位了，饭都可以省","I"],
  ["够味的零食，照样当饭","B"],
  ["看心情，今天甜食当家","C"]],
 ["看到有人吃你童年的那款零食，你会：",
  ["一秒回到小卖部门口","G"],
  ["上去搭话，瞬间熟络","A"],
  ["拍下来发群里当话题","H"],
  ["心里一暖，也拿了一包","C"]],
 ["你的零食口头禅是：",

  ["冰的，来一口？","J"]],
 ["用一个词形容你的零食人格：",
  ["热闹","A"],
  ["治愈","C"],
  ["回味","G"],

];

let idx = 0, score = {};
const $ = id => document.getElementById(id);

function start(){
  idx = 0; score = {};
  $("home").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}
function render(){
  const q = QS[idx];
  $("qnum").textContent = "第 " + (idx+1) + " 题";
  $("qtext").textContent = q[0];
  $("cnow").textContent = idx+1;
  $("pbar").style.width = (idx/32*100) + "%";
  const box = $("opts"); box.innerHTML = "";
  q.slice(1).forEach(([text,key])=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = text;
    b.onclick = ()=>pick(key);
    box.appendChild(b);
  });
  window.scrollTo(0,0);
}
function pick(key){
  score[key] = (score[key]||0) + 1;
  idx++;
  if(idx < QS.length) render(); else show();
}
function show(){
  $("quiz").classList.add("hidden");
  $("res").classList.remove("hidden");
  const order = ["A","B","C","D","E","F","G","H","I","J"];
  let best = order[0];
  order.forEach(k=>{ if((score[k]||0) > (score[best]||0)) best = k; });
  const t = TYPES[best];
  $("remoji").textContent = t.e;
  $("rname").textContent = t.n;
  $("rtag").textContent = "—— " + t.t + " ——";
  $("rbody").textContent = t.b;
  $("rstep").textContent = t.s;
  $("rwarn").textContent = t.w;
  const sorted = order.map(k=>[k,score[k]||0]).sort((a,b)=>b[1]-a[1]);
  const second = TYPES[sorted[1][0]];
  $("rstat").textContent = "次高人格：" + second.n + "（" + second.t + "）· 32 题答完，" + (score[best]||0) + " 题指向这个人格。零食不分高低，对味的就是最好的。";
  $("res").dataset.text = "我在「零食人格大揭秘」里测出了【" + t.n + "】："
    + t.t + "。" + t.s + " 来测测你的零食人格 →";
  window.scrollTo(0,0);
}
function copyRes(){
  const text = $("res").dataset.text;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert("已复制，去评论区报零食吧 👀"));
  }else{
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    alert("已复制，去评论区报零食吧 👀");
  }
}
</script>
